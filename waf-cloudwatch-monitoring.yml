AWSTemplateFormatVersion: "2010-09-09"
Description: "Template for CloudWatch CPUUtilization and WAF"

  # パラメータを設定
Parameters:
  InfraName:
    Type: String
    Default: AWS-Study-CFn
  ProjectName:
    Type: String
    Default: SpringBoot-sample-app
  Period:
    Type: Number
    Default: 60
  EvaluationPeriods:
    Type: Number
    Default: 1
  Threshold:
    Type: Number
    Default: 70
  PreCreatedTopicName:
    Type: String
    Default: "ec2-CPUUtilization"
Resources:
# ec2の「1分間あたりのCPU使用率が70％以上が1回測定される状態」になったらアラートを出すようにCloudWatchを設定
# SNSトピックを作成し、登録したメールに通知が届くようにする（サブスクリプションのメールアドレス登録は事前に設定）
  CPUAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: CPU alarm for my instance
      MetricName: CPUUtilization
      Namespace: AWS/EC2
      Statistic: Average
      Period: !Ref Period
      EvaluationPeriods: !Ref EvaluationPeriods
      Threshold: !Ref Threshold
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
      - Name: InstanceId
        Value: !ImportValue ec2-server-id
      AlarmActions:
      - !Sub 'arn:aws:sns:${AWS::Region}:${AWS::AccountId}:${PreCreatedTopicName}'
      Tags:
        - Key: Name
          Value: !Sub ${InfraName}-CloudWatch-CPUUtilization-Alert
        - Key: Project
          Value: !Ref ProjectName

# WAFの設定 ALBにWAF（ファイアウォールの設定）をし、CloudWatchLogsに集約しメトリクスを参照できるようにする
