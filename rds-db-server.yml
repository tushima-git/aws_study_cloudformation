AWSTemplateFormatVersion: "2010-09-09"
Description: Template for RDS MySQL DB Server

Resources:
# 1. カスタムDBパラメーターグループの定義（ログ記録の有効化）
  RDSdbServerParameterGroup:
    Type: AWS::RDS::DBParameterGroup
    Properties:
      Description: "Custom Parameter Group for MySQL Log Export"
      Family: "mysql8.4"
      Parameters:
        general_log: "1"
        slow_query_log: "1"
        long_query_time: "2"
        log_output: "FILE"

# SecretManagerでパスワード管理 #RDSに接続するためのパスワードをランダム作成
  RDSPasswordSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Name: RDSPasswordSecret
      Description: Create RDS password for RDS MySQL DB Server
      GenerateSecretString:
        SecretStringTemplate: '{"username": "root"}'
        GenerateStringKey: "password"
        PasswordLength: 16
        ExcludeCharacters: '"@/\'
# DBサブネットグループの設定
  rdsMySQLdbServerSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: "rds MySQL Subnet group"
      SubnetIds:
        - !ImportValue private-subnet-az-1a
        - !ImportValue private-subnet-az-1c
# 拡張モニタリング有効化の設定
  RDSMonitoringRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: monitoring.rds.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonRDSEnhancedMonitoringRole

# RDSの作成
  rdsMySQLdbServer:
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Type: AWS::RDS::DBInstance
    Properties:
      MultiAZ: true
      Engine: mysql
      EngineVersion: 8.4.9
      DBName: awsstudy
      MasterUsername: root
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${RDSPasswordSecret}:SecretString:password}}'
      DBInstanceClass: db.m7g.large
      Port: 3306
      PubliclyAccessible: false
      StorageType: gp3
      AllocatedStorage: 20
      MaxAllocatedStorage: 1000
      VPCSecurityGroups:
        - !ImportValue rds-security-group-id
      DBSubnetGroupName: !Ref rdsMySQLdbServerSubnetGroup
      MonitoringInterval: 60
      MonitoringRoleArn: !GetAtt RDSMonitoringRole.Arn
      DBParameterGroupName: !Ref RDSdbServerParameterGroup
      EnableCloudwatchLogsExports:
        - audit
        - error
        - general
        - iam-db-auth-error
        - slowquery
      BackupRetentionPeriod: 1
      DeletionProtection: true
      Tags:
        - Key: Name
          Value: AWS-Study-Project
        - Key: ProjectName
          Value: SpringBoot-sample-app-project


